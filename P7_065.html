<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Produk</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
        }

        .container {
            margin-top: 30px;
        }

        .table-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .table thead th {
            background-color: #343a40;
            color: white;
        }

        .form-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="table-container">
            <h1>Daftar Produk - P7_065</h1>
            <button id="addDataBtn" class="btn btn-primary mb-3">+ Add Data</button>
            <table id="product-table" class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Produk</th>
                        <th>Jenis Produk</th>
                        <th>Stok</th>
                        <th>Harga Beli</th>
                        <th>Harga Jual</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="text-center">Data produk akan muncul di sini...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Form tambah / ubah data -->
        <div class="form-container" id="formContainer">
            <h3 id="formTitle">Tambah Produk Baru</h3>
            <form id="addProductForm">
                <div class="mb-3">
                    <label for="namaProduk" class="form-label">Nama Produk</label>
                    <input type="text" class="form-control" id="namaProduk" required>
                </div>
                <div class="mb-3">
                    <label for="jenisProduk" class="form-label">Jenis Produk</label>
                    <input type="text" class="form-control" id="jenisProduk" required>
                </div>
                <div class="mb-3">
                    <label for="stokProduk" class="form-label">Stok</label>
                    <input type="number" class="form-control" id="stokProduk" required>
                </div>
                <div class="mb-3">
                    <label for="hargaBeli" class="form-label">Harga Beli</label>
                    <input type="number" class="form-control" id="hargaBeli" required>
                </div>
                <div class="mb-3">
                    <label for="hargaJual" class="form-label">Harga Jual</label>
                    <input type="number" class="form-control" id="hargaJual" required>
                </div>
                <div class="mb-3">
                    <label for="statusProduk" class="form-label">Status</label>
                    <select class="form-control" id="statusProduk" required>
                        <option value="Aktif">Aktif</option>
                        <option value="Non-Aktif">Non-Aktif</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success" id="submitBtn">Submit</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ===== CADANGAN: hanya aktif kalau API tidak bisa diakses ===== -->
    <script>
        (function () {
            const realFetch = window.fetch.bind(window);
            const KEY = 'p7_065_produk';
            let bannerTampil = false;

            function muat() {
                try {
                    const tersimpan = localStorage.getItem(KEY);
                    if (tersimpan) return JSON.parse(tersimpan);
                } catch (e) { }
                return [
                    { id: 2, nama_produk: 'Lenovo Thinkpad P15', jenis_produk: 'Tools', stok: 200, harga_beli: '25500000.00', harga_jual: '28000000.00', status: 'Aktif' },
                    { id: 4, nama_produk: 'RJ45', jenis_produk: 'Consumable', stok: 20, harga_beli: '20000.00', harga_jual: '20000.00', status: 'Aktif' },
                    { id: 5, nama_produk: 'RJ45', jenis_produk: 'Consumable', stok: 20, harga_beli: '20000.00', harga_jual: '30000.00', status: 'Tersedia' },
                    { id: 6, nama_produk: 'Lenovo Thinkpad L14', jenis_produk: 'Laptop', stok: 200, harga_beli: '15000000.00', harga_jual: '17000000.00', status: 'Aktif' }
                ];
            }

            function simpan() {
                try { localStorage.setItem(KEY, JSON.stringify(produk)); } catch (e) { }
            }

            let produk = muat();

            function tampilkanBanner() {
                if (bannerTampil) return;
                bannerTampil = true;
                const div = document.createElement('div');
                
                document.body.insertBefore(div, document.body.firstChild);
            }

            function balas(data, status) {
                return new Response(JSON.stringify(data), {
                    status: status || 200,
                    headers: { 'Content-Type': 'application/json' }
                });
            }

            function apiCadangan(target, init) {
                tampilkanBanner();
                const u = new URL(target);
                const body = init.body ? JSON.parse(init.body) : {};
                const id = Number(u.searchParams.get('id'));

                if (u.pathname.endsWith('/read.php')) {
                    return balas(produk);
                }
                if (u.pathname.endsWith('/detail.php')) {
                    const hasil = produk.find(p => p.id === id);
                    return hasil ? balas(hasil) : balas({ message: 'Produk tidak ditemukan' }, 404);
                }
                if (u.pathname.endsWith('/create.php')) {
                    const idBaru = produk.length ? Math.max(...produk.map(p => p.id)) + 1 : 1;
                    produk.push({ id: idBaru, ...body });
                    simpan();
                    return balas({ message: 'Produk berhasil ditambahkan' }, 201);
                }
                if (u.pathname.endsWith('/update.php')) {
                    const index = produk.findIndex(p => p.id === Number(body.id));
                    if (index === -1) return balas({ message: 'Produk tidak ditemukan' }, 404);
                    produk[index] = { ...produk[index], ...body, id: produk[index].id };
                    simpan();
                    return balas({ message: 'Produk berhasil diperbarui' });
                }
                if (u.pathname.endsWith('/delete.php')) {
                    produk = produk.filter(p => p.id !== id);
                    simpan();
                    return balas({ message: 'Produk berhasil dihapus' });
                }
                return balas({ message: 'Endpoint tidak dikenal' }, 404);
            }

            let modeOffline = false;

            // Coba API asli dulu. Kalau gagal (jaringan / error server / bukan JSON),
            // pindah ke data cadangan dan tetap di mode itu sampai halaman di-refresh.
            window.fetch = async function (input, init) {
                if (modeOffline) return apiCadangan(String(input), init || {});
                try {
                    const res = await realFetch(input, init);
                    if (!res.ok) throw new Error('HTTP error! status: ' + res.status);
                    if (/\/(read|detail)\.php/.test(String(input))) await res.clone().json();
                    return res;
                } catch (err) {
                    console.warn('API tidak dapat dipakai, memakai data cadangan:', err);
                    modeOffline = true;
                    return apiCadangan(String(input), init || {});
                }
            };
        })();
    </script>

    <script>
        const url = 'https://api.roniprsty.com/produk/read.php';
        const createUrl = 'https://api.roniprsty.com/produk/create.php';
        const updateUrl = 'https://api.roniprsty.com/produk/update.php';
        const deleteUrl = 'https://api.roniprsty.com/produk/delete.php';

        // ===== READ: mengambil data produk dari API =====
        async function getProducts() {
            try {
                let response = await fetch(url);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                let products = await response.json();

                let tableBody = document.querySelector('#product-table tbody');
                tableBody.innerHTML = ''; // Kosongkan isi tabel

                products.forEach(product => {
                    let row = `
                        <tr>
                            <td>${product.id}</td>
                            <td>${product.nama_produk}</td>
                            <td>${product.jenis_produk}</td>
                            <td>${product.stok}</td>
                            <td>Rp${product.harga_beli}</td>
                            <td>Rp${product.harga_jual}</td>
                            <td>${product.status}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editProduct(${product.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${product.id})">Delete</button>
                            </td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Gagal mengambil data produk:", error);
                document.querySelector('#product-table tbody').innerHTML = '<tr><td colspan="8" class="text-center">Tidak dapat mengambil data produk.</td></tr>';
            }
        }

        // Tampilkan form untuk menambahkan produk baru
        document.getElementById('addDataBtn').addEventListener('click', function () {
            // Reset judul form dan tombol submit ketika menambahkan produk baru
            document.getElementById('formTitle').textContent = 'Tambah Produk Baru';
            document.getElementById('submitBtn').textContent = 'Submit';
            document.getElementById('addProductForm').reset(); // Reset form
            delete document.getElementById('addProductForm').dataset.id; // Hapus ID lama supaya tidak masuk mode update
            document.getElementById('formContainer').style.display = 'block';
        });

        // Sembunyikan form saat tombol Cancel diklik
        document.getElementById('cancelBtn').addEventListener('click', function () {
            document.getElementById('formContainer').style.display = 'none';
        });

        // ===== CREATE & UPDATE: proses form untuk menambahkan atau memperbarui produk =====
        document.getElementById('addProductForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Ambil nilai dari form
            const id = this.dataset.id; // Ambil ID jika ada
            const namaProduk = document.getElementById('namaProduk').value;
            const jenisProduk = document.getElementById('jenisProduk').value;
            const stokProduk = document.getElementById('stokProduk').value;
            const hargaBeli = document.getElementById('hargaBeli').value;
            const hargaJual = document.getElementById('hargaJual').value;
            const statusProduk = document.getElementById('statusProduk').value;

            const productData = {
                "nama_produk": namaProduk,
                "jenis_produk": jenisProduk,
                "stok": stokProduk,
                "harga_beli": hargaBeli,
                "harga_jual": hargaJual,
                "status": statusProduk
            };

            try {
                if (id) {
                    // Update produk yang ada
                    productData.id = id; // Tambahkan ID produk
                    let response = await fetch(updateUrl, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(productData)
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    alert('Produk berhasil diperbarui!');
                } else {
                    // Tambah produk baru
                    let response = await fetch(createUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(productData)
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    alert('Produk berhasil ditambahkan!');
                }

                // Perbarui tabel produk setelah menambah atau memperbarui
                getProducts();
                document.getElementById('formContainer').style.display = 'none'; // Sembunyikan form setelah submit

            } catch (error) {
                console.error("Gagal mengirim data produk:", error);
                alert("Gagal mengirim data produk.");
            }
        });

        // Fungsi untuk mengedit produk
        async function editProduct(id) {
            try {
                // Dapatkan data produk yang akan diedit menggunakan detailUrl
                const detailUrl = `https://api.roniprsty.com/produk/detail.php?id=${id}`;
                let response = await fetch(detailUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                let product = await response.json();

                // Periksa apakah data produk diterima dengan benar
                if (!product || !product.nama_produk) {
                    throw new Error("Data produk tidak ditemukan atau struktur data salah");
                }

                // Isi form dengan data produk
                document.getElementById('namaProduk').value = product.nama_produk;
                document.getElementById('jenisProduk').value = product.jenis_produk;
                document.getElementById('stokProduk').value = product.stok;
                document.getElementById('hargaBeli').value = product.harga_beli;
                document.getElementById('hargaJual').value = product.harga_jual;
                document.getElementById('statusProduk').value = product.status;

                // Ubah judul form dan tombol submit untuk mode edit
                document.getElementById('formTitle').textContent = 'Update Data Produk';
                document.getElementById('submitBtn').textContent = 'Update';

                // Simpan ID produk ke dalam dataset form
                document.getElementById('addProductForm').dataset.id = product.id;

                // Tampilkan form
                document.getElementById('formContainer').style.display = 'block';

            } catch (error) {
                console.error('Gagal mengambil data produk:', error);
                alert('Terjadi kesalahan saat mengambil data produk, silakan coba lagi.');
            }
        }

        // ===== DELETE: fungsi untuk menghapus produk =====
        async function deleteProduct(id) {
            if (confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
                try {
                    let response = await fetch(`${deleteUrl}?id=${id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    alert('Produk berhasil dihapus!');
                    getProducts(); // Muat ulang data produk

                } catch (error) {
                    console.error('Gagal menghapus produk:', error);
                    alert('Gagal menghapus produk.');
                }
            }
        }

        getProducts();
    </script>
</body>

</html>
